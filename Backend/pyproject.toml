[project]
name = "rag-system-backend"
version = "0.1.0"
description = "API FastAPI du système RAG adaptatif (LangGraph)"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5",
    "python-dotenv>=1.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    # Base de données
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # LangChain / LangGraph
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "tavily-python>=0.3",
    "pypdf>=4.0",  # repli d'ingestion sans Docling
]

[project.optional-dependencies]
# Modèles locaux (reranker cross-encoder, embeddings Nomic) : lourds, exclus de la CI.
# Inutiles avec EMBEDDING_PROVIDER=openai|cohere et RERANKER_PROVIDER=cohere|none.
ml = [
    "langchain-nomic>=0.1",
    "sentence-transformers>=2.2",
    "torch>=2.0",
]

# Traçage Langfuse des exécutions (facultatif).
observability = ["langfuse>=3"]

# Ingestion structurée des PDF (tableaux conservés). Nécessite le téléchargement de modèles.
# torchvision (requis par docling) est déclaré pour lui appliquer l'index CPU de [tool.uv.sources].
ingest = ["docling>=2.0", "torchvision"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "reportlab>=4.0",  # PDF de test (repli pypdf)
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv]
package = false

# Torch CPU sous Linux (image Docker sans GPU) : évite ~4 Go de bibliothèques CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "scripts"]

[tool.ruff.lint]
# E/F/W : erreurs de base ; I : tri des imports ; B : bugs courants
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # la longueur de ligne est laissée au formateur

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "W291", "F841", "B905"]
"api/main.py" = ["E402"]  # le patch bcrypt doit être importé en premier
"alembic/versions/*" = ["E501", "I001", "W291", "W293"]
"api/services/auth_service.py" = ["E402", "F403"]

[tool.pyright]
include = ["api", "config", "src", "evaluation"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
