# Production (VPS) :
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Seul Caddy publie des ports (80/443). La base et l'API ne sont pas exposées.
# .env.prod (non versionné) : SITE_ADDRESS=rag.exemple.fr  POSTGRES_PASSWORD=<fort>
# Backend/.env : clés d'API, JWT_SECRET_KEY, ADMIN_EMAIL/ADMIN_PASSWORD, ENVIRONMENT=prod, COOKIE_SECURE=true,
#                CORS_ORIGINS=https://rag.exemple.fr, TRUST_PROXY_HEADERS=true
# Base managée (Neon, Supabase, RDS…) : retirer le service `postgres`, fixer DATABASE_URL dans Backend/.env.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./Backend
    restart: unless-stopped
    env_file: ./Backend/.env
    environment:
      ENVIRONMENT: prod
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
      CORS_ORIGINS: https://${SITE_ADDRESS:?SITE_ADDRESS est requis}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ragdata:/app/data

  frontend:
    build: ./Frontend
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - frontend

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./Backend/scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["sh", "-c", "while true; do sh /scripts/backup_db.sh || true; sleep 86400; done"]

volumes:
  pgdata:
  ragdata:
  caddy_data:
  backups:
